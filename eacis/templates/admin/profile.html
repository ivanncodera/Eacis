{% extends 'base.html' %}
{% block title %}Admin Profile{% endblock %}
{% block content %}
<div class="page-content" style="max-width:760px; margin:0 auto; padding:var(--sp-8);">
  <h1 class="type-display-sm" style="margin-bottom:var(--sp-6);">Account Profile</h1>

  <form id="admin-profile-form" method="post" class="glass-card p-8" style="display:grid; gap:var(--sp-6);">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label class="form-label">Email</label>
      <input type="email" class="form-input" value="{{ user.email }}" readonly>
    </div>
    <div class="form-group">
      <label for="full_name" class="form-label">Full Name</label>
      <input id="full_name" name="full_name" type="text" class="form-input" value="{{ user.full_name or '' }}">
    </div>

    <hr style="border:none; border-top:1px solid var(--border-subtle); margin:0;">

    <div class="type-label mb-2">Change Password</div>
    <div class="form-group">
      <label class="form-label">Current Password</label>
      <input id="current_password" name="current_password" type="password" class="form-input" autocomplete="current-password">
    </div>
    <div class="form-group">
      <label class="form-label">New Password</label>
      <input id="new_password" name="new_password" type="password" class="form-input" minlength="8" autocomplete="new-password">
    </div>
    <div class="form-group">
      <label class="form-label">Confirm New Password</label>
      <input id="confirm_password" name="confirm_password" type="password" class="form-input" minlength="8" autocomplete="new-password">
      <small id="pwd-match" class="form-error" style="display:none;">Passwords do not match.</small>
    </div>

    <div style="display:flex; justify-content:flex-end; gap:var(--sp-3);">
      <a href="/admin" class="btn btn--white">Back</a>
      <button type="button" class="btn btn--primary btn--xl" id="save-profile-btn">Save Profile</button>
    </div>
  </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const newPwd = document.getElementById('new_password');
  const confirmPwd = document.getElementById('confirm_password');
  const matchEl = document.getElementById('pwd-match');
  const form = document.getElementById('admin-profile-form');
  const saveBtn = document.getElementById('save-profile-btn');

  function containsEmoji(s) {
    if (!s) return false;
    try { return /\p{Extended_Pictographic}/u.test(s); } catch (e) { return /[\uD800-\uDBFF][\uDC00-\uDFFF]/.test(s); }
  }

  function clearJsFieldErrors(f) {
    if (!f) return; const els = f.querySelectorAll('[data-js-error="1"]'); els.forEach(e => e.remove());
  }

  function addFieldError(el, msg) {
    if (!el) return;
    const next = el.nextElementSibling;
    if (next && next.getAttribute && next.getAttribute('data-js-error') === '1') { next.textContent = msg; return; }
    const div = document.createElement('div');
    div.className = 'form-error-text';
    div.style.color = 'var(--color-danger)';
    div.style.fontSize = '11px';
    div.style.marginTop = '4px';
    div.setAttribute('data-js-error','1');
    div.textContent = msg;
    el.insertAdjacentElement('afterend', div);
  }

  function checkMatch() {
    if (!newPwd || !confirmPwd) return true;
    if (newPwd.value === '' && confirmPwd.value === '') { matchEl.style.display='none'; return true; }
    if (newPwd.value !== confirmPwd.value) { matchEl.style.display='block'; return false; }
    matchEl.style.display='none'; return true;
  }

  if (newPwd) newPwd.addEventListener('input', checkMatch);
  if (confirmPwd) confirmPwd.addEventListener('input', checkMatch);

  function clientValidateAdminForm(f) {
    clearJsFieldErrors(f);
    const errs = [];
    const fullName = f.querySelector('[name="full_name"]');
    const current = f.querySelector('[name="current_password"]');
    const newp = f.querySelector('[name="new_password"]');
    const conf = f.querySelector('[name="confirm_password"]');

    if (fullName) {
      const v = (fullName.value||'').trim();
      if (!v || v.length < 2) { addFieldError(fullName, 'Full name is required (min 2 characters).'); errs.push('full_name'); }
      else if (containsEmoji(v)) { addFieldError(fullName, 'Name cannot contain emoji.'); errs.push('full_name'); }
    }

    if (newp && newp.value) {
      if (!current || !(current.value && current.value.length)) { addFieldError(current || newp, 'Enter your current password to change password.'); errs.push('current_password'); }
      if (newp.value.length < 8) { addFieldError(newp, 'New password must be at least 8 characters.'); errs.push('new_password'); }
      if (conf && newp.value !== conf.value) { addFieldError(conf, 'Passwords do not match.'); errs.push('confirm_password'); }
    }

    return errs.length === 0;
  }

  function doSubmit() {
    if (!saveBtn || !form) return;
    saveBtn.disabled = true;
    const label = saveBtn.querySelector('.btn__label');
    if (label) label.textContent = saveBtn.getAttribute('data-saving-text') || 'Saving...';
    form.submit();
  }

  if (saveBtn) {
    saveBtn.addEventListener('click', function (ev) {
      ev.preventDefault();
      if (!form) return;
      if (!clientValidateAdminForm(form)) {
        const first = form.querySelector('[data-js-error="1"]');
        if (first && first.previousElementSibling) first.previousElementSibling.focus();
        return;
      }
      const message = 'Save changes to admin profile?';
      if (window.confirmModal) {
        confirmModal(message).then(ok => { if (!ok) return; doSubmit(); });
      } else {
        if (confirm(message)) doSubmit();
      }
    });
  }
});
</script>

{% endblock %}
